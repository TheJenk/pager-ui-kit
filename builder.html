<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pager View Builder</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#0c0e14;--panel:#12151e;--panel2:#171b26;--line:#232a38;--text:#e8ecf3;
    --dim:#8893a6;--accent:#5aa0dc;--accent2:#2fae6a}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif}
  body{display:flex;flex-direction:column;height:100vh;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;padding:10px 18px;border-bottom:1px solid var(--line);background:var(--panel)}
  header .logo{font-weight:800;font-size:17px} header .logo span{color:var(--accent)}
  header .sub{color:var(--dim);font-size:13px} header .spacer{flex:1}
  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel2);color:var(--text);
    border-radius:8px;padding:7px 11px;font-size:13px}
  button:hover{border-color:#39465c;background:#1d2230}
  button.danger{color:#ff8a7a}
  button.sm{font-size:12px;padding:5px 9px}
  main{flex:1;display:flex;min-height:0}
  .nav{width:250px;border-right:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .nav h3{margin:0;padding:11px 14px 7px;font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
  .palette{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;border-bottom:1px solid var(--line)}
  .tree{flex:1;overflow:auto;padding:4px 8px 12px;font-size:13px}
  .row{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .row:hover{background:var(--panel2)} .row.sel{background:#1b3a2c;outline:1px solid #2f7d57}
  .row .ty{font-weight:600} .row .sm{color:var(--dim);overflow:hidden;text-overflow:ellipsis}
  .center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;min-width:0;padding:16px}
  .stage{background:#000;border:3px solid #1f2735;border-radius:12px;padding:6px;box-shadow:0 18px 50px rgba(0,0,0,.6)}
  canvas#cv{display:block;image-rendering:pixelated;border-radius:4px;width:900px;height:416px}
  .hint{color:var(--dim);font-size:12px}
  #inspResize{width:8px;flex:none;cursor:ew-resize;background:var(--line);position:relative}
  #inspResize::after{content:"";position:absolute;top:50%;left:3px;height:34px;width:2px;margin-top:-17px;background:#3a4660;border-radius:2px}
  #inspResize:hover{background:#2c3850}
  .insp{width:290px;background:var(--panel);display:flex;flex-direction:column;min-height:0}
  .insp h3{margin:0;padding:11px 16px 7px;font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
  .props{padding:0 16px 14px;overflow:auto}
  .props .empty{color:var(--dim);font-size:13px;padding:6px 0}
  .field{display:flex;align-items:center;gap:8px;margin:8px 0}
  .field label{width:66px;color:var(--dim);font-size:12px;flex:none}
  .field input,.field select{flex:1;min-width:0;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:6px;padding:6px 8px;font:inherit;font-size:13px}
  .act{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  #codeResize{height:8px;flex:none;cursor:ns-resize;background:var(--line);position:relative}
  #codeResize::after{content:"";position:absolute;left:50%;top:3px;width:34px;height:2px;margin-left:-17px;background:#3a4660;border-radius:2px}
  #codeResize:hover{background:#2c3850}
  footer{border-top:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;height:240px;min-height:80px}
  .codebar{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line)}
  .codebar .ttl{font-size:11px;letter-spacing:1.5px;color:var(--dim);text-transform:uppercase}
  #code{flex:1;margin:0;border:0;outline:0;resize:none;background:var(--bg);color:#cdd6e4;
    padding:12px 16px;font:500 13px/1.6 'SF Mono',Menlo,monospace;tab-size:2;white-space:pre}
</style>
</head>
<body>
<header>
  <div class="logo">Pager&nbsp;<span>View&nbsp;Builder</span></div>
  <div class="sub">build a screen &middot; export a <b>.view</b> file &middot; edit either side, both stay in sync</div>
  <div class="spacer"></div>
  <button id="howBtn">Use in a payload…</button>
  <button id="sampleBtn">Sample</button>
  <button class="danger" id="newBtn">New</button>
</header>
<main>
  <aside class="nav">
    <h3>Add into selection</h3>
    <div class="palette" id="palette"></div>
    <h3>Outline</h3>
    <div class="tree" id="tree"></div>
  </aside>
  <div class="center">
    <div class="stage"><canvas id="cv" width="480" height="222"></canvas></div>
    <div class="hint">Click an element to select &middot; edit it on the right &middot; or type the view below</div>
  </div>
  <div id="inspResize"></div>
  <aside class="insp" id="insp">
    <h3>Inspector</h3>
    <div class="props" id="props"><div class="empty">Select an element.</div></div>
  </aside>
</main>
<div id="codeResize"></div>
<footer>
  <div class="codebar"><span class="ttl">screen.view — edit freely; the canvas follows</span>
    <div class="spacer" style="flex:1"></div><button id="copyBtn">Copy .view</button></div>
  <textarea id="code" spellcheck="false"></textarea>
</footer>

<script>
const FONT=[[0,0,0,0,0,0,0],[4,4,4,4,4,0,4],[10,10,0,0,0,0,0],[10,31,10,31,10,0,0],[31,17,17,17,17,17,31],[17,2,4,8,17,0,0],[12,18,12,21,19,13,0],[4,4,0,0,0,0,0],[2,4,4,4,4,4,2],[8,4,4,4,4,4,8],[0,10,4,31,4,10,0],[0,4,4,31,4,4,0],[0,0,0,0,4,4,8],[0,0,0,31,0,0,0],[0,0,0,0,0,4,4],[1,1,2,4,8,16,16],[14,17,19,21,25,17,14],[4,12,4,4,4,4,14],[14,17,1,2,4,8,31],[31,2,4,2,1,17,14],[2,6,10,18,31,2,2],[31,16,30,1,1,17,14],[6,8,16,30,17,17,14],[31,1,2,4,8,8,8],[14,17,17,14,17,17,14],[14,17,17,15,1,2,12],[0,4,4,0,4,4,0],[31,17,17,17,17,17,31],[2,4,8,16,8,4,2],[0,0,31,0,31,0,0],[8,4,2,1,2,4,8],[14,17,1,2,4,0,4],[14,17,23,21,23,16,14],[14,17,17,31,17,17,17],[30,17,17,30,17,17,30],[14,17,16,16,16,17,14],[28,18,17,17,17,18,28],[31,16,16,30,16,16,31],[31,16,16,30,16,16,16],[14,17,16,23,17,17,14],[17,17,17,31,17,17,17],[14,4,4,4,4,4,14],[7,2,2,2,18,18,12],[17,18,20,24,20,18,17],[16,16,16,16,16,16,31],[17,27,21,17,17,17,17],[17,25,21,19,17,17,17],[14,17,17,17,17,17,14],[30,17,17,30,16,16,16],[14,17,17,17,21,18,13],[30,17,17,30,20,18,17],[15,16,16,14,1,1,30],[31,4,4,4,4,4,4],[17,17,17,17,17,17,14],[17,17,17,17,17,10,4],[17,17,17,21,21,27,17],[17,17,10,4,10,17,17],[17,17,10,4,4,4,4],[31,1,2,4,8,16,31],[14,8,8,8,8,8,14],[31,17,17,17,17,17,31],[14,2,2,2,2,2,14],[31,17,17,17,17,17,31],[0,0,0,0,0,0,31]];
const W=480,H=222;
const PAL={BG:'0e1016',BAR:'1a2234',LINE:'2b3a52',TEXT:'e8ecf3',DIM:'7f8aa0',ACCENT:'5aa0dc'};
const NAMED={white:'ffffff',grey:'7f8aa0',gray:'7f8aa0',dim:'7f8aa0',text:'e8ecf3',accent:'5aa0dc',
  red:'e0483f',green:'2fae6a',blue:'3a86c8',cyan:'3ac8c8',yellow:'e0c23f',amber:'e0a53f',orange:'e07b3f',purple:'9b7ede',pink:'e06ba0'};
const COLOROPTS=['text','dim','accent','white','red','green','blue','cyan','yellow','amber','orange','purple','pink'];
function hex(c){ if(!c)return '#'+PAL.TEXT; const l=(''+c).toLowerCase();
  if(NAMED[l])return '#'+NAMED[l]; if(PAL[c.toUpperCase()])return '#'+PAL[c.toUpperCase()];
  if(/^[0-9a-f]{6}$/.test(l))return '#'+l; return '#'+PAL.ACCENT; }

const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const codeEl=document.getElementById('code');

// ---- draw primitives (match the renderer) ----
function tw(s,sz){ s=''+s; return s.length? s.length*6*sz-sz:0; }
function fill(x,y,w,h,c){ ctx.fillStyle=hex(c); ctx.fillRect(x,y,w,h); }
function box(x,y,w,h,c){ ctx.fillStyle=hex(c); ctx.fillRect(x,y,w,1);ctx.fillRect(x,y+h-1,w,1);ctx.fillRect(x,y,1,h);ctx.fillRect(x+w-1,y,1,h); }
function text(x,y,s,c,sz){ s=(''+s).toUpperCase(); ctx.fillStyle=hex(c); sz=sz||1;
  for(const ch of s){ const code=ch.charCodeAt(0); if(code>=0x20&&code<0x60){ const g=FONT[code-0x20];
    for(let r=0;r<7;r++){ const b=g[r]; for(let col=0;col<5;col++) if(b&(1<<(4-col))) ctx.fillRect(x+col*sz,y+r*sz,sz,sz);} } x+=6*sz; } }

// ---- node model ----
const TYPES=['VStack','HStack','ZStack','Card','Text','Header','Footer','Meter','Graph','Bar','Image','Spacer'];
const CONTAINER=t=>['VStack','HStack','ZStack','Card'].includes(t);
function mk(t){ const n={type:t,text:'',text2:'',color:'text',size:2,pct:70,values:'4 7 5 9 6 8 10 6 7 5 8',
    spacing:6,pad:8,fixH:-1,fixW:-1,src:'',kids:[]};
  if(t==='Header')n.text='TITLE'; if(t==='Footer'){n.text='GREEN OK';n.text2='RED EXIT';}
  if(t==='Card')n.text='CARD'; if(t==='Text'){n.text='Label';n.color='text';}
  if(t==='Meter')n.color='green'; if(t==='Graph')n.color='accent'; if(t==='Bar')n.color='accent';
  if(t==='Image')n.src='logo.png';
  return n; }
let root=null, sel=null;

// ---- parse .view -> tree ----
function parseView(src){ let i=0;
  const sws=()=>{ for(;;){ while(i<src.length&&' \t\r\n,'.includes(src[i]))i++;
    if(src[i]==='/'&&src[i+1]==='/'){ while(i<src.length&&src[i]!=='\n')i++; continue;} break; } };
  const rid=()=>{ sws(); let b=''; while(i<src.length&&/[A-Za-z0-9_\-]/.test(src[i]))b+=src[i++]; return b; };
  const rstr=()=>{ sws(); if(src[i]!=='"')return null; i++; let b=''; while(i<src.length&&src[i]!=='"'){ if(src[i]==='\\'&&src[i+1])i++; b+=src[i++]; } if(src[i]==='"')i++; return b; };
  function applyDot(n,m){ if(['big','med','small'].includes(m)) n.size={big:3,med:2,small:1}[m]; else n.color=m; }
  function pArgs(n){ let first=true; for(;;){ sws(); if(src[i]===')'||i>=src.length)break;
    if(src[i]==='"'){ const s=rstr(); if(n.type==='Footer'){ if(first)n.text=s; else n.text2=s; }
        else if(n.type==='Graph')n.values=s; else if(n.type==='Image')n.src=s; else n.text=s; }
    else if(src[i]==='.'){ i++; applyDot(n,rid()); }
    else { const id=rid(); sws(); if(src[i]===':'){ i++; sws();
        if(src[i]==='"'){ n.text=rstr(); } else if(src[i]==='.'){ i++; applyDot(n,rid()); }
        else { const v=rid(); if(id==='value')n.pct=parseInt(v)||0; else if(id==='spacing')n.spacing=parseInt(v)||6; } }
      else { if(!n.text)n.text=id; } }
    first=false; sws(); if(src[i]===',')i++; } }
  function pMods(n){ for(;;){ sws(); if(src[i]!=='.')break; i++; const m=rid(); sws(); let a=0;
    if(src[i]==='('){ i++; a=parseInt(rid())||0; sws(); if(src[i]===')')i++; }
    if(m==='h')n.fixH=a; else if(m==='w')n.fixW=a; else if(m==='pad')n.pad=a; else if(m==='size')n.size=a; else applyDot(n,m); } }
  function pNode(){ sws(); const name=rid(); if(!name||!TYPES.includes(name))return null; const n=mk(name); sws();
    if(src[i]==='('){ i++; pArgs(n); sws(); if(src[i]===')')i++; } pMods(n); sws();
    if(src[i]==='{'){ i++; for(;;){ sws(); if(src[i]==='}'||i>=src.length)break; const k=pNode(); if(!k){ i++; continue; } n.kids.push(k); } sws(); if(src[i]==='}')i++; }
    return n; }
  const r=pNode(); return r||mk('VStack'); }

// ---- generate .view <- tree ----
function gen(n,ind){ ind=ind||'';
  let a=[];
  if(n.type==='Footer'){ a.push('"'+n.text+'"'); if(n.text2)a.push('"'+n.text2+'"'); }
  else if(n.type==='Graph'){ a.push('"'+n.values+'"'); }
  else if(n.type==='Image'){ a.push('"'+n.src+'"'); }
  else if(n.type==='Meter'){ a.push('value: '+n.pct); }
  else if(['Card','Text','Header'].includes(n.type) && n.text!==''){ a.push('"'+n.text+'"'); }
  if((n.type==='VStack'||n.type==='HStack')&&n.spacing!==6) a.push('spacing: '+n.spacing);
  if(['Text','Meter','Graph','Bar'].includes(n.type) && n.color && n.color!=='text') a.push('.'+n.color);
  if(n.type==='Text' && n.size!==2) a.push('.'+({1:'small',3:'big'}[n.size]||('size('+n.size+')')));
  let head=n.type; let paren = a.length?('('+a.join(', ')+')'):(n.type==='Spacer'?'()':'');
  let mods=''; if(n.fixH>=0)mods+='.h('+n.fixH+')'; if(n.fixW>=0)mods+='.w('+n.fixW+')';
  if(n.kids && n.kids.length){ const inner=n.kids.map(k=>gen(k,ind+'  ')).join('\n');
    return ind+head+paren+mods+' {\n'+inner+'\n'+ind+'}'; }
  return ind+head+paren+mods; }

// ---- layout (ported from the engine) ----
function mainIntr(k,parent){ if(parent==='VStack'){ if(k.fixH>=0)return k.fixH;
    if(k.type==='Header')return 26; if(k.type==='Footer')return 16; if(k.type==='Text')return 7*k.size+6; return -1; }
  else { if(k.fixW>=0)return k.fixW; if(k.type==='Text')return tw(k.text,k.size); return -1; } }
function layout(n,x,y,w,h){ n.x=x;n.y=y;n.w=w;n.h=h;
  if(n.type==='VStack'||n.type==='HStack'){ const vert=n.type==='VStack'; const main=vert?h:w,cross=vert?w:h,sp=n.spacing;
    const gap=sp*(n.kids.length>1?n.kids.length-1:0); let fixed=0,flex=0;
    n.kids.forEach(k=>{ const m=mainIntr(k,n.type); if(m>=0)fixed+=m; else flex++; });
    let remain=main-fixed-gap; if(remain<0)remain=0; const each=flex?Math.floor(remain/flex):0; let pos=vert?y:x;
    n.kids.forEach(k=>{ const m=mainIntr(k,n.type); const sz=m>=0?m:each; if(vert)layout(k,x,pos,cross,sz); else layout(k,pos,y,sz,cross); pos+=sz+sp; }); }
  else if(n.type==='Card'){ if(n.kids.length){ const p=n.pad,th=n.text?18:0; const cy=y+p+th,ch=h-p-th-p; const k=n.kids[0];
    const kh=k.type==='Text'?7*k.size:ch; let oy=cy+Math.floor((ch-kh)/2); if(oy<cy)oy=cy; layout(k,x+p,oy,w-2*p,kh); } }
  else if(n.type==='ZStack'){ n.kids.forEach(k=>layout(k,x,y,w,h)); } }

// ---- draw ----
function drawNode(n){ switch(n.type){
  case 'VStack': case 'HStack': case 'ZStack': n.kids.forEach(drawNode); break;
  case 'Header': fill(0,n.y,W,26,'BAR'); fill(0,n.y+26,W,1,'LINE'); text(10,n.y+6,n.text,'ACCENT',2); break;
  case 'Footer': fill(n.x,n.y,n.w,1,'LINE'); if(n.text)text(n.x+8,n.y+4,n.text,'DIM',1);
    if(n.text2)text(n.x+n.w-8-tw(n.text2,1),n.y+4,n.text2,'DIM',1); break;
  case 'Card': fill(n.x,n.y,n.w,n.h,'BAR'); box(n.x,n.y,n.w,n.h,'LINE'); if(n.text)text(n.x+10,n.y+8,n.text,'TEXT',2); n.kids.forEach(drawNode); break;
  case 'Text': text(n.x,n.y,n.text,n.color,n.size); break;
  case 'Bar': fill(n.x,n.y,n.w,n.h,n.color); break;
  case 'Meter':{ box(n.x,n.y,n.w,n.h,'LINE'); let p=Math.max(0,Math.min(100,n.pct)); const fw=Math.floor((n.w-2)*p/100); if(fw>0)fill(n.x+1,n.y+1,fw,n.h-2,n.color); break; }
  case 'Graph':{ const vs=(''+n.values).trim().split(/\s+/).map(Number).filter(v=>!isNaN(v)); if(!vs.length){ box(n.x,n.y,n.w,n.h,'LINE'); break; }
    const mx=Math.max(1,...vs); let bw=Math.floor(n.w/vs.length); if(bw<1)bw=1; const gap=1; if(bw>2)bw-=gap;
    vs.forEach((v,i)=>{ let bh=Math.floor(v*(n.h-1)/mx); if(bh<1)bh=1; fill(n.x+i*(bw+gap),n.y+n.h-bh,bw,bh,n.color); }); break; }
  case 'Image': fill(n.x,n.y,n.w,n.h,'1b2432'); box(n.x,n.y,n.w,n.h,'ACCENT');
    text(n.x+6,n.y+Math.max(4,(n.h-7)/2),'IMG '+n.src,'DIM',1); break;
  case 'Spacer': break; } }

function render(){ fill(0,0,W,H,'BG'); layout(root,0,0,W,H); drawNode(root);
  if(sel){ ctx.strokeStyle='#2fe08a'; ctx.setLineDash([3,2]); ctx.strokeRect(sel.x+.5,sel.y+.5,Math.max(1,sel.w-1),Math.max(1,sel.h-1)); ctx.setLineDash([]); }
  renderTree(); renderProps(); }

// ---- tree <-> code sync ----
function pushCode(){ codeEl.value=gen(root); }
function pullCode(){ try{ root=parseView(codeEl.value); if(sel&&!findNode(root,sel))sel=null; render(); }catch(e){} }
function findNode(n,t){ if(n===t)return true; return (n.kids||[]).some(k=>findNode(k,t)); }
function parentOf(n,t,p){ p=p||null; if(n===t)return p; for(const k of (n.kids||[])){ const r=parentOf(k,t,n); if(r!==undefined)return r; } return undefined; }

// ---- palette (add) ----
function renderPalette(){ const el=document.getElementById('palette'); el.innerHTML='';
  TYPES.forEach(t=>{ const b=document.createElement('button'); b.className='sm'; b.textContent=t; b.onclick=()=>add(t); el.appendChild(b); }); }
function add(t){ const n=mk(t); let target = sel && CONTAINER(sel.type) ? sel : (sel ? parentOf(root,sel) : root);
  if(!target) target=root;
  if(sel && target!==sel){ const idx=target.kids.indexOf(sel); target.kids.splice(idx+1,0,n); }
  else target.kids.push(n);
  sel=n; pushCode(); render(); }
function del(n){ const p=parentOf(root,n); if(!p){ return; } p.kids.splice(p.kids.indexOf(n),1); sel=null; pushCode(); render(); }
function move(n,d){ const p=parentOf(root,n); if(!p)return; const i=p.kids.indexOf(n); const j=i+d; if(j<0||j>=p.kids.length)return;
  p.kids.splice(i,1); p.kids.splice(j,0,n); pushCode(); render(); }
function wrap(n,stack){ const p=parentOf(root,n); if(!p)return; const w=mk(stack); w.kids=[n]; p.kids[p.kids.indexOf(n)]=w; sel=w; pushCode(); render(); }

// ---- outline ----
function renderTree(){ const el=document.getElementById('tree'); el.innerHTML=''; walk(root,0,el); }
function walk(n,depth,el){ const d=document.createElement('div'); d.className='row'+(n===sel?' sel':''); d.style.paddingLeft=(6+depth*14)+'px';
  const ty=document.createElement('span'); ty.className='ty'; ty.textContent=n.type;
  const sm=document.createElement('span'); sm.className='sm'; sm.textContent=n.text||n.text2||(n.type==='Graph'?'series':n.type==='Image'?n.src:'');
  d.appendChild(ty); if(sm.textContent){ d.appendChild(document.createTextNode(' ')); d.appendChild(sm); }
  d.onclick=()=>{ sel=n; render(); }; el.appendChild(d);
  (n.kids||[]).forEach(k=>walk(k,depth+1,el)); }

// ---- inspector ----
const FIELDS={ VStack:[['spacing','n']], HStack:[['spacing','n']], ZStack:[],
  Card:[['text','s','title'],['pad','n']],
  Text:[['text','s'],['color','c'],['size','n']],
  Header:[['text','s']], Footer:[['text','s','left'],['text2','s','right']],
  Meter:[['pct','n','value'],['color','c']], Graph:[['values','s'],['color','c']],
  Bar:[['color','c']], Image:[['src','s']], Spacer:[] };
function renderProps(){ const p=document.getElementById('props'); if(!sel){ p.innerHTML='<div class="empty">Select an element.</div>'; return; }
  p.innerHTML=''; const h=document.createElement('div'); h.style.cssText='font-weight:700;margin:4px 0 8px'; h.textContent=sel.type; p.appendChild(h);
  (FIELDS[sel.type]||[]).forEach(([k,kind,lbl])=>{ const row=document.createElement('div'); row.className='field';
    const l=document.createElement('label'); l.textContent=lbl||k; row.appendChild(l); let inp;
    if(kind==='c'){ inp=document.createElement('select'); const o=[...COLOROPTS]; if(!o.includes(sel[k]))o.unshift(sel[k]);
      o.forEach(c=>{ const op=document.createElement('option'); op.value=c; op.textContent=c; inp.appendChild(op); }); inp.value=sel[k]; }
    else { inp=document.createElement('input'); inp.value=sel[k]; }
    inp.oninput=()=>{ sel[k]=kind==='n'?(parseInt(inp.value)||0):inp.value; pushCode(); render(); };
    row.appendChild(inp); p.appendChild(row); });
  // size modifiers for any element
  const szrow=document.createElement('div'); szrow.className='field';
  szrow.innerHTML='<label>fix h/w</label>';
  const ih=document.createElement('input'); ih.placeholder='h'; ih.style.width='50px'; ih.value=sel.fixH>=0?sel.fixH:''; ih.title='fixed height .h()';
  const iw=document.createElement('input'); iw.placeholder='w'; iw.style.width='50px'; iw.value=sel.fixW>=0?sel.fixW:''; iw.title='fixed width .w()';
  ih.oninput=()=>{ sel.fixH=ih.value===''?-1:(parseInt(ih.value)||0); pushCode(); render(); };
  iw.oninput=()=>{ sel.fixW=iw.value===''?-1:(parseInt(iw.value)||0); pushCode(); render(); };
  szrow.appendChild(ih); szrow.appendChild(iw); p.appendChild(szrow);
  // actions
  const act=document.createElement('div'); act.className='act';
  const mk2=(t,f,cls)=>{ const b=document.createElement('button'); b.className='sm'+(cls?' '+cls:''); b.textContent=t; b.onclick=f; return b; };
  act.appendChild(mk2('↑',()=>move(sel,-1))); act.appendChild(mk2('↓',()=>move(sel,1)));
  act.appendChild(mk2('Wrap V',()=>wrap(sel,'VStack'))); act.appendChild(mk2('Wrap H',()=>wrap(sel,'HStack')));
  if(sel!==root) act.appendChild(mk2('Delete',()=>del(sel),'danger'));
  p.appendChild(act); }

// ---- canvas select ----
function toDev(ev){ const r=cv.getBoundingClientRect(); return {x:Math.round((ev.clientX-r.left)/r.width*W),y:Math.round((ev.clientY-r.top)/r.height*H)}; }
function deepest(n,p){ let found=null; const inside=(n.x<=p.x&&p.x<=n.x+n.w&&n.y<=p.y&&p.y<=n.y+n.h);
  (n.kids||[]).forEach(k=>{ const r=deepest(k,p); if(r)found=r; }); if(found)return found; return inside?n:null; }
cv.addEventListener('click',ev=>{ const p=toDev(ev); const n=deepest(root,p); sel=n||root; render(); });

// ---- code editing (two-way) ----
let typing; codeEl.addEventListener('input',()=>{ clearTimeout(typing); typing=setTimeout(pullCode,140); });

// ---- top buttons ----
document.getElementById('newBtn').onclick=()=>{ if(confirm('Start a new, empty view?')){ root=mk('VStack'); sel=root; pushCode(); render(); } };
document.getElementById('sampleBtn').onclick=()=>loadSample();
document.getElementById('copyBtn').onclick=()=>{ navigator.clipboard.writeText(codeEl.value).then(()=>{ const b=document.getElementById('copyBtn'); b.textContent='Copied!'; setTimeout(()=>b.textContent='Copy .view',1200); }); };
document.getElementById('howBtn').onclick=()=>alert(
"Save what's in the box as e.g. hunt.view next to your payload, then:\n\n"+
"  . ui.sh\n  UI_BEGIN\n  name=\"Beast Mode\"; sig=-50; p=100   # your data\n  UI_RENDER hunt.view                   # draws the view\n  UI_KEY\n  UI_END\n\n"+
"\\(name), \\(sig) in the view are filled in from those shell variables.");

// ---- resizers ----
function rz(h,fn){ h.addEventListener('mousedown',e=>{ e.preventDefault(); document.body.style.userSelect='none';
  const mv=ev=>fn(ev), up=()=>{ document.body.style.userSelect=''; removeEventListener('mousemove',mv); removeEventListener('mouseup',up); };
  addEventListener('mousemove',mv); addEventListener('mouseup',up); }); }
const footerEl=document.querySelector('footer'), inspEl=document.getElementById('insp');
rz(document.getElementById('codeResize'),ev=>{ let v=innerHeight-ev.clientY; v=Math.max(80,Math.min(v,innerHeight-200)); footerEl.style.height=v+'px'; });
rz(document.getElementById('inspResize'),ev=>{ let v=innerWidth-ev.clientX; v=Math.max(210,Math.min(v,520)); inspEl.style.width=v+'px'; });

// ---- sample ----
const SAMPLE=`VStack(spacing: 6) {
  Header("HUNTING \\(name)")
  HStack(spacing: 8) {
    Card("SIGNAL")    { Text("\\(sig)", .green, .big) }
    Card("CLOSENESS") { Text("\\(p)%", .green, .big) }
    Card("TREND")     { Text("\\(trend)", .amber) }
  }.h(62)
  Meter(value: 100, .green).h(20)
  Graph("4 7 5 9 6 8 10 6 9 7 5 8", .green).h(50)
  Spacer()
  Footer("CLOSER = FULLER + GREENER", "RED BACK")
}`;
function loadSample(){ codeEl.value=SAMPLE; root=parseView(SAMPLE); sel=null; render(); }
renderPalette(); loadSample();
</script>
